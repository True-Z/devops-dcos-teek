<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect width="960" height="520" fill="#f6f7fb"/>
  <text x="480" y="52" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#263238">热身与拉伸流程</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="130" width="180" height="120" rx="20" fill="#fff" stroke="#f4a261" stroke-width="3"/>
    <text x="160" y="170" text-anchor="middle" font-size="22" fill="#8a4b08">1. 关节活动</text>
    <text x="160" y="202" text-anchor="middle" font-size="16" fill="#333">肩 / 腕 / 髋 / 膝 / 踝</text>

    <rect x="285" y="130" width="180" height="120" rx="20" fill="#fff" stroke="#2a9d8f" stroke-width="3"/>
    <text x="375" y="170" text-anchor="middle" font-size="22" fill="#14645c">2. 轻量激活</text>
    <text x="375" y="202" text-anchor="middle" font-size="16" fill="#333">小跑 / 开合跳 / 提膝</text>

    <rect x="500" y="130" width="180" height="120" rx="20" fill="#fff" stroke="#457b9d" stroke-width="3"/>
    <text x="590" y="170" text-anchor="middle" font-size="22" fill="#1d4e69">3. 正式训练</text>
    <text x="590" y="202" text-anchor="middle" font-size="16" fill="#333">跑步 / 打球 / 基础训练</text>

    <rect x="715" y="130" width="180" height="120" rx="20" fill="#fff" stroke="#b56576" stroke-width="3"/>
    <text x="805" y="170" text-anchor="middle" font-size="22" fill="#742635">4. 拉伸放松</text>
    <text x="805" y="202" text-anchor="middle" font-size="16" fill="#333">小腿 / 大腿 / 肩背</text>

    <line x1="250" y1="190" x2="285" y2="190" stroke="#777" stroke-width="4"/>
    <line x1="465" y1="190" x2="500" y2="190" stroke="#777" stroke-width="4"/>
    <line x1="680" y1="190" x2="715" y2="190" stroke="#777" stroke-width="4"/>
  </g>
  <text x="480" y="330" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#37474f">热身让身体进入状态，拉伸帮助身体退出训练状态。</text>
  <text x="480" y="370" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#455a64">训练前不硬拉，训练后不硬压到疼。</text>
</svg>
