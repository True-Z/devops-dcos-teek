<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <rect width="960" height="620" fill="#fbf7f2"/>
  <text x="480" y="48" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#263238">基础动作常见错误</text>
  <g font-family="Arial, sans-serif">
    <rect x="50" y="90" width="260" height="220" rx="18" fill="#fff" stroke="#d77a61" stroke-width="3"/>
    <text x="180" y="126" text-anchor="middle" font-size="22" fill="#8d3d2f">深蹲错误</text>
    <text x="180" y="174" text-anchor="middle" font-size="18" fill="#333">- 膝盖乱内扣</text>
    <text x="180" y="208" text-anchor="middle" font-size="18" fill="#333">- 身体前扑太多</text>
    <text x="180" y="242" text-anchor="middle" font-size="18" fill="#333">- 下去过快，起身发飘</text>

    <rect x="350" y="90" width="260" height="220" rx="18" fill="#fff" stroke="#6c91c2" stroke-width="3"/>
    <text x="480" y="126" text-anchor="middle" font-size="22" fill="#2b5b92">俯卧撑错误</text>
    <text x="480" y="174" text-anchor="middle" font-size="18" fill="#333">- 塌腰</text>
    <text x="480" y="208" text-anchor="middle" font-size="18" fill="#333">- 耸肩</text>
    <text x="480" y="242" text-anchor="middle" font-size="18" fill="#333">- 下去太快，动作变形</text>

    <rect x="650" y="90" width="260" height="220" rx="18" fill="#fff" stroke="#8f6bb3" stroke-width="3"/>
    <text x="780" y="126" text-anchor="middle" font-size="22" fill="#52306f">平板支撑错误</text>
    <text x="780" y="174" text-anchor="middle" font-size="18" fill="#333">- 塌腰</text>
    <text x="780" y="208" text-anchor="middle" font-size="18" fill="#333">- 臀部抬太高</text>
    <text x="780" y="242" text-anchor="middle" font-size="18" fill="#333">- 只撑时间，不管姿势</text>

    <rect x="200" y="350" width="260" height="220" rx="18" fill="#fff" stroke="#6a994e" stroke-width="3"/>
    <text x="330" y="386" text-anchor="middle" font-size="22" fill="#3a5f23">箭步蹲错误</text>
    <text x="330" y="434" text-anchor="middle" font-size="18" fill="#333">- 前腿不稳</text>
    <text x="330" y="468" text-anchor="middle" font-size="18" fill="#333">- 下沉时身体摇晃</text>
    <text x="330" y="502" text-anchor="middle" font-size="18" fill="#333">- 只练一边，不练另一边</text>

    <rect x="500" y="350" width="260" height="220" rx="18" fill="#fff" stroke="#b08968" stroke-width="3"/>
    <text x="630" y="386" text-anchor="middle" font-size="22" fill="#6b4226">通用提醒</text>
    <text x="630" y="434" text-anchor="middle" font-size="18" fill="#333">动作不标准时先降难度</text>
    <text x="630" y="468" text-anchor="middle" font-size="18" fill="#333">不要只求数量</text>
    <text x="630" y="502" text-anchor="middle" font-size="18" fill="#333">不舒服先停，再调整</text>
  </g>
</svg>
