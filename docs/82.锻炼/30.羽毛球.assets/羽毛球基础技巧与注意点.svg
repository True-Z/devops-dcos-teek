<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#fbf7f3"/>
  <text x="480" y="50" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#2d3436">羽毛球基础技巧与注意点</text>
  <circle cx="270" cy="115" r="30" fill="#f0c9a4" stroke="#444" stroke-width="2"/>
  <line x1="270" y1="145" x2="270" y2="260" stroke="#444" stroke-width="16" stroke-linecap="round"/>
  <line x1="270" y1="175" x2="220" y2="225" stroke="#444" stroke-width="14" stroke-linecap="round"/>
  <line x1="270" y1="175" x2="330" y2="150" stroke="#444" stroke-width="14" stroke-linecap="round"/>
  <line x1="330" y1="150" x2="390" y2="108" stroke="#444" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="405" cy="97" rx="18" ry="10" fill="#fff" stroke="#444" stroke-width="2"/>
  <line x1="270" y1="260" x2="230" y2="350" stroke="#444" stroke-width="16" stroke-linecap="round"/>
  <line x1="270" y1="260" x2="320" y2="340" stroke="#444" stroke-width="16" stroke-linecap="round"/>
  <text x="275" y="420" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#333">先稳步伐，再控制挥拍</text>

  <rect x="520" y="100" width="320" height="300" rx="18" fill="#fff" stroke="#c08552" stroke-width="3"/>
  <text x="680" y="142" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#7a4e21">注意点</text>
  <text x="548" y="186" font-size="18" font-family="Arial, sans-serif" fill="#333">- 先热身肩、腕、膝、踝</text>
  <text x="548" y="226" font-size="18" font-family="Arial, sans-serif" fill="#333">- 不靠猛甩手腕硬发力</text>
  <text x="548" y="266" font-size="18" font-family="Arial, sans-serif" fill="#333">- 步伐先稳，不急着乱冲</text>
  <text x="548" y="306" font-size="18" font-family="Arial, sans-serif" fill="#333">- 关节不舒服时先停下来</text>
  <text x="548" y="346" font-size="18" font-family="Arial, sans-serif" fill="#333">- 打完补水并做放松拉伸</text>
</svg>
