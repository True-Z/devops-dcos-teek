<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <rect width="960" height="620" fill="#fbf8f4"/>
  <text x="480" y="46" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#263238">羽毛球：握拍 / 准备姿势 / 步伐 分解</text>

  <g font-family="Arial, sans-serif">
    <rect x="50" y="90" width="260" height="420" rx="18" fill="#fff" stroke="#c08552" stroke-width="3"/>
    <text x="180" y="126" text-anchor="middle" font-size="22" fill="#7a4e21">1. 握拍</text>
    <rect x="145" y="180" width="18" height="110" rx="8" fill="#7f5539"/>
    <ellipse cx="154" cy="165" rx="28" ry="16" fill="#fff" stroke="#444" stroke-width="2"/>
    <circle cx="198" cy="208" r="18" fill="#f0c9a4" stroke="#444" stroke-width="2"/>
    <text x="180" y="340" text-anchor="middle" font-size="17" fill="#333">握稳，不要死攥</text>
    <text x="180" y="368" text-anchor="middle" font-size="17" fill="#333">发力要顺，不靠硬拧手腕</text>

    <rect x="350" y="90" width="260" height="420" rx="18" fill="#fff" stroke="#457b9d" stroke-width="3"/>
    <text x="480" y="126" text-anchor="middle" font-size="22" fill="#1d4e69">2. 准备姿势</text>
    <circle cx="480" cy="185" r="18" fill="#f0c9a4" stroke="#444" stroke-width="2"/>
    <line x1="480" y1="203" x2="480" y2="292" stroke="#444" stroke-width="10" stroke-linecap="round"/>
    <line x1="480" y1="228" x2="440" y2="258" stroke="#444" stroke-width="8" stroke-linecap="round"/>
    <line x1="480" y1="228" x2="522" y2="248" stroke="#444" stroke-width="8" stroke-linecap="round"/>
    <line x1="480" y1="292" x2="445" y2="360" stroke="#444" stroke-width="10" stroke-linecap="round"/>
    <line x1="480" y1="292" x2="515" y2="360" stroke="#444" stroke-width="10" stroke-linecap="round"/>
    <text x="480" y="340" text-anchor="middle" font-size="17" fill="#333">屈膝，重心别太高</text>
    <text x="480" y="368" text-anchor="middle" font-size="17" fill="#333">准备随时起动</text>

    <rect x="650" y="90" width="260" height="420" rx="18" fill="#fff" stroke="#6a994e" stroke-width="3"/>
    <text x="780" y="126" text-anchor="middle" font-size="22" fill="#3a5f23">3. 步伐</text>
    <text x="780" y="198" text-anchor="middle" font-size="18" fill="#333">小步调整</text>
    <text x="780" y="232" text-anchor="middle" font-size="18" fill="#333">跨步到位</text>
    <text x="780" y="266" text-anchor="middle" font-size="18" fill="#333">回位准备</text>
    <text x="780" y="312" text-anchor="middle" font-size="17" fill="#333">先稳，再快</text>
    <text x="780" y="340" text-anchor="middle" font-size="17" fill="#333">不要乱冲乱跳</text>
    <text x="780" y="368" text-anchor="middle" font-size="17" fill="#333">膝盖和脚踝都要保护</text>
  </g>
</svg>
