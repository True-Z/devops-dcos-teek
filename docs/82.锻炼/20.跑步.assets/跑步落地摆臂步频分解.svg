<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <rect width="960" height="620" fill="#f7faf8"/>
  <text x="480" y="46" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#263238">跑步：落地 / 摆臂 / 步频 分解</text>

  <g font-family="Arial, sans-serif">
    <rect x="50" y="90" width="260" height="420" rx="18" fill="#fff" stroke="#5c9ead" stroke-width="3"/>
    <text x="180" y="126" text-anchor="middle" font-size="22" fill="#1d4e69">1. 落地</text>
    <circle cx="150" cy="185" r="18" fill="#f0c9a4" stroke="#444" stroke-width="2"/>
    <line x1="150" y1="203" x2="150" y2="292" stroke="#444" stroke-width="10" stroke-linecap="round"/>
    <line x1="150" y1="228" x2="118" y2="260" stroke="#444" stroke-width="8" stroke-linecap="round"/>
    <line x1="150" y1="228" x2="185" y2="248" stroke="#444" stroke-width="8" stroke-linecap="round"/>
    <line x1="150" y1="292" x2="124" y2="360" stroke="#444" stroke-width="10" stroke-linecap="round"/>
    <line x1="150" y1="292" x2="205" y2="340" stroke="#444" stroke-width="10" stroke-linecap="round"/>
    <line x1="96" y1="390" x2="214" y2="390" stroke="#7d8597" stroke-width="6"/>
    <text x="180" y="438" text-anchor="middle" font-size="17" fill="#333">脚下落自然稳定</text>
    <text x="180" y="465" text-anchor="middle" font-size="17" fill="#333">不要猛砸地面</text>

    <rect x="350" y="90" width="260" height="420" rx="18" fill="#fff" stroke="#8f6bb3" stroke-width="3"/>
    <text x="480" y="126" text-anchor="middle" font-size="22" fill="#52306f">2. 摆臂</text>
    <circle cx="480" cy="185" r="18" fill="#f0c9a4" stroke="#444" stroke-width="2"/>
    <line x1="480" y1="203" x2="480" y2="294" stroke="#444" stroke-width="10" stroke-linecap="round"/>
    <line x1="480" y1="228" x2="430" y2="270" stroke="#444" stroke-width="8" stroke-linecap="round"/>
    <line x1="480" y1="228" x2="530" y2="255" stroke="#444" stroke-width="8" stroke-linecap="round"/>
    <line x1="480" y1="294" x2="448" y2="370" stroke="#444" stroke-width="10" stroke-linecap="round"/>
    <line x1="480" y1="294" x2="525" y2="350" stroke="#444" stroke-width="10" stroke-linecap="round"/>
    <text x="480" y="438" text-anchor="middle" font-size="17" fill="#333">手臂自然前后摆</text>
    <text x="480" y="465" text-anchor="middle" font-size="17" fill="#333">不要耸肩和乱甩</text>

    <rect x="650" y="90" width="260" height="420" rx="18" fill="#fff" stroke="#6a994e" stroke-width="3"/>
    <text x="780" y="126" text-anchor="middle" font-size="22" fill="#3a5f23">3. 步频</text>
    <text x="780" y="210" text-anchor="middle" font-size="52" fill="#3a5f23">1 - 2 - 1 - 2</text>
    <text x="780" y="270" text-anchor="middle" font-size="18" fill="#333">小步、稳定、连续</text>
    <text x="780" y="305" text-anchor="middle" font-size="18" fill="#333">不要一开始迈太大</text>
    <text x="780" y="340" text-anchor="middle" font-size="18" fill="#333">先把节奏跑顺</text>
    <text x="780" y="375" text-anchor="middle" font-size="18" fill="#333">再慢慢加时间和距离</text>
  </g>
</svg>
