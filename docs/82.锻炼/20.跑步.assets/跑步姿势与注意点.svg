<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#f8faf7"/>
  <text x="480" y="50" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#2d3436">跑步姿势与注意点</text>
  <circle cx="290" cy="118" r="30" fill="#f0c9a4" stroke="#444" stroke-width="2"/>
  <line x1="290" y1="148" x2="290" y2="260" stroke="#444" stroke-width="16" stroke-linecap="round"/>
  <line x1="290" y1="175" x2="240" y2="225" stroke="#444" stroke-width="14" stroke-linecap="round"/>
  <line x1="290" y1="175" x2="340" y2="210" stroke="#444" stroke-width="14" stroke-linecap="round"/>
  <line x1="290" y1="260" x2="250" y2="355" stroke="#444" stroke-width="16" stroke-linecap="round"/>
  <line x1="290" y1="260" x2="345" y2="332" stroke="#444" stroke-width="16" stroke-linecap="round"/>
  <line x1="215" y1="385" x2="310" y2="385" stroke="#7d8597" stroke-width="6"/>
  <text x="290" y="430" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#333">身体微前倾，手臂自然摆动</text>

  <rect x="500" y="110" width="330" height="280" rx="18" fill="#fff" stroke="#84a98c" stroke-width="3"/>
  <text x="665" y="150" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#2f5d50">跑步要点</text>
  <text x="530" y="195" font-size="18" font-family="Arial, sans-serif" fill="#333">- 先慢跑，不急着追配速</text>
  <text x="530" y="235" font-size="18" font-family="Arial, sans-serif" fill="#333">- 落地尽量稳定，不要猛砸地</text>
  <text x="530" y="275" font-size="18" font-family="Arial, sans-serif" fill="#333">- 跑前热身，跑后拉伸</text>
  <text x="530" y="315" font-size="18" font-family="Arial, sans-serif" fill="#333">- 不舒服就降强度或停止</text>
  <text x="530" y="355" font-size="18" font-family="Arial, sans-serif" fill="#333">- 跑量逐步增加，不要突然翻倍</text>
</svg>
